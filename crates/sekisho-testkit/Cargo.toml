[package]
name = "sekisho-testkit"
description = "Test support for Sekisho: throwaway PostgreSQL stores and a mock model server"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sekisho-mock-model"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
crc = { workspace = true }
sekisho-core = { workspace = true }
sekisho-store = { workspace = true }
serde_json = { workspace = true }
testcontainers = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { workspace = true }
uuid = { workspace = true }

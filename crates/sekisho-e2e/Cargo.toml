[package]
name = "sekisho-e2e"
description = "End-to-end acceptance tests against agentgateway v1.7.0 (see e2e/docker-compose.yml)"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
# The stream hook's token count, for the bounds of an estimate.
sekisho-hooks = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

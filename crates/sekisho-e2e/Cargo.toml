[package]
name = "sekisho-e2e"
description = "End-to-end acceptance tests against agentgateway v1.7.0 and Dex v2.46.1 (see e2e/docker-compose.yml)"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = { workspace = true }
reqwest = { workspace = true, features = ["form", "json"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
# The stream hook's token count, for the bounds of an estimate.
sekisho-hooks = { workspace = true }

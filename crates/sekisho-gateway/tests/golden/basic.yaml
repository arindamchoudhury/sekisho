config:
  modelCatalog:
  - inline:
      providers:
        mock:
          models:
            mock-model:
              rates:
                input: '3'
                output: '15'
                cacheRead: '1.5'
                cacheWrite: '3'
binds:
- port: 3000
  listeners:
  - name: sekisho
    protocol: HTTP
    routes:
    - name: data-team-openai
      matches:
      - path:
          pathPrefix: /env/data-team/openai
        method: POST
      policies:
        requestHeaderModifier:
          remove:
          - x-api-key
          - api-key
          - x-goog-api-key
        urlRewrite:
          path:
            prefix: /
        extAuthz:
          host: sekisho:9080
          protocol:
            http:
              addRequestHeaders:
                x-sekisho-env: '"data-team"'
              metadata:
                key: response.headers["x-sekisho-key"]
                person: response.headers["x-sekisho-person"]
          includeRequestHeaders:
          - authorization
          failureMode: deny
        remoteRateLimit:
          host: sekisho:9081
          domain: sekisho
          failureMode: failClosed
          descriptors:
          - type: tokens
            entries:
            - key: env
              value: '"data-team"'
            - key: key
              value: extauthz.key
            - key: person
              value: extauthz.person
            - key: secret
              value: '"test-charge-secret"'
            - key: model
              value: llm.requestModel
            - key: request
              value: default(extproc.sekisho_request, "")
            - key: measure
              value: '"input"'
            cost: llm.inputTokens
          - type: tokens
            entries:
            - key: env
              value: '"data-team"'
            - key: key
              value: extauthz.key
            - key: person
              value: extauthz.person
            - key: secret
              value: '"test-charge-secret"'
            - key: model
              value: llm.requestModel
            - key: request
              value: default(extproc.sekisho_request, "")
            - key: measure
              value: '"cache_read"'
            cost: llm.cachedInputTokens
          - type: tokens
            entries:
            - key: env
              value: '"data-team"'
            - key: key
              value: extauthz.key
            - key: person
              value: extauthz.person
            - key: secret
              value: '"test-charge-secret"'
            - key: model
              value: llm.requestModel
            - key: request
              value: default(extproc.sekisho_request, "")
            - key: measure
              value: '"cache_write"'
            cost: llm.cacheCreationInputTokens
          - type: tokens
            entries:
            - key: env
              value: '"data-team"'
            - key: key
              value: extauthz.key
            - key: person
              value: extauthz.person
            - key: secret
              value: '"test-charge-secret"'
            - key: model
              value: llm.requestModel
            - key: request
              value: default(extproc.sekisho_request, "")
            - key: measure
              value: '"output"'
            cost: llm.outputTokens
          - type: tokens
            entries:
            - key: env
              value: '"data-team"'
            - key: key
              value: extauthz.key
            - key: person
              value: extauthz.person
            - key: secret
              value: '"test-charge-secret"'
            - key: model
              value: llm.requestModel
            - key: request
              value: default(extproc.sekisho_request, "")
            - key: measure
              value: '"catalog"'
            cost: int(llm.cost.total * 1000000.0 + 0.5)
          - type: tokens
            entries:
            - key: env
              value: '"data-team"'
            - key: key
              value: extauthz.key
            - key: person
              value: extauthz.person
            - key: secret
              value: '"test-charge-secret"'
            - key: model
              value: llm.requestModel
            - key: request
              value: default(extproc.sekisho_request, "")
            - key: measure
              value: '"prompt"'
        extProc:
          host: sekisho:9081
          failureMode: failClosed
          processingOptions:
            requestBodyMode: none
            responseBodyMode: fullDuplexStreamed
      backends:
      - ai:
          name: mock
          provider:
            custom:
              providerOverride: mock
              formats:
              - type: completions
          tokenize: true
          hostOverride: mock:8000
          pathPrefix: /v1
        policies:
          ai:
            routes:
              /v1/chat/completions: completions
              /v1/responses: responses
          backendAuth:
            key: mock-key
          authorization:
            rules:
            - require: llm.requestModel in ["mock-model"]

[package]
name = "sekisho-server"
description = "The sekisho binary: admin API, gateway config publishing and hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sekisho"
path = "src/main.rs"

[features]
# Lets SEKISHO_E2E_BARE_ROUTE=1 add the hook-free /bare/openai route that the
# end-to-end latency test compares against, and lets cloud credentials reach
# the mock model (sekisho-store/e2e). Only the e2e image is built with it:
# that route serves a provider with its key and no checks.
e2e = ["sekisho-store/e2e"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
sekisho-auth = { workspace = true }
sekisho-catalog = { workspace = true }
sekisho-core = { workspace = true }
sekisho-gateway = { workspace = true }
sekisho-hooks = { workspace = true }
sekisho-proto = { workspace = true }
sekisho-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["serde", "formatting", "parsing"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }
tower-service = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["form", "json"] }
sekisho-testkit = { workspace = true }
sqlx = { workspace = true }

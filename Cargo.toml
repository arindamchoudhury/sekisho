[workspace]
members = ["crates/*"]
resolver = "3"

# Debug and test builds keep file and line numbers for Sekisho's own code and
# no debug info for dependencies, as Cargo's build-performance guide
# recommends: with full debug info, every test binary carried all of it and
# `target/` passed 240 GB. `test` inherits from `dev`. For a debugger, build
# with `--profile debugging` (output in `target/debugging/`).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

# `inherits` also copies `dev`'s override for dependencies; undo it here so a
# debugger can step into them too.
[profile.debugging.package."*"]
debug = true

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/arindamchoudhury/sekisho"

[workspace.dependencies]
sekisho-auth = { path = "crates/sekisho-auth" }
sekisho-catalog = { path = "crates/sekisho-catalog" }
sekisho-cli = { path = "crates/sekisho-cli" }
sekisho-core = { path = "crates/sekisho-core" }
sekisho-gateway = { path = "crates/sekisho-gateway" }
sekisho-hooks = { path = "crates/sekisho-hooks" }
sekisho-proto = { path = "crates/sekisho-proto" }
sekisho-store = { path = "crates/sekisho-store" }
sekisho-testkit = { path = "crates/sekisho-testkit" }
aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bcrypt = "0.19.3"
clap = { version = "4.6.7", features = ["derive"] }
crc = "3.4.0"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "zeroize"] }
etcetera = "0.11.0"
glob = "0.3.4"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12"] }
hyper-util = { version = "0.1.21", default-features = false }
jsonschema = { version = "0.60.1", default-features = false }
# Edits a coding tool's JSON-with-comments config in place, keeping the
# user's comments (plan 4, Task 4).
jsonc-parser = { version = "0.34.0", default-features = false, features = ["cst", "serde_json"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
# The CLI's credential store (plan 4, D195, D213): the platform's keyring
# through keyring's v1 stores, keyring-core for entries with modifiers, and
# the kernel's keyutils on Linux without Secret Service.
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
keyring-core = "1.0.1"
linux-keyutils-keyring-store = "1.0.0"
open = "5.4.5"
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.10.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false }
# TLS for what Sekisho fetches itself (catalog sources' registries and agent
# cards), through hyper-rustls with ring passed explicitly: no aws-lc-rs build,
# and reqwest stays plain HTTP everywhere (D178).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
# The per-file diff behind `sekisho use --dry-run` (plan 4).
similar = "3.2.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "time", "uuid", "migrate", "macros"] }
tempfile = "3.27.0"
testcontainers = "0.28.0"
thiserror = "2.0.21"
# agentgateway v1.7.0's tokenizer, for counting answers (plan 1c).
tiktoken = { version = "4.1.2", default-features = false, features = ["vocab-o200k_base"] }
time = "0.3.55"
tokio = "1.54.1"
tokio-stream = "0.1.19"
# Edits Codex's TOML keeping the user's comments (plan 4).
toml_edit = "0.23.9"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5.3"
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = "1.29.0"
# Password guessability for local accounts (D122); its default feature is a builder.
zxcvbn = { version = "3.1.1", default-features = false }

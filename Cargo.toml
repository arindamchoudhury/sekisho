[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/arindamchoudhury/sekisho"

[workspace.dependencies]
sekisho-core = { path = "crates/sekisho-core" }
sekisho-gateway = { path = "crates/sekisho-gateway" }
sekisho-hooks = { path = "crates/sekisho-hooks" }
sekisho-proto = { path = "crates/sekisho-proto" }
sekisho-store = { path = "crates/sekisho-store" }
sekisho-testkit = { path = "crates/sekisho-testkit" }
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crc = "3.4.0"
jsonschema = { version = "0.60.1", default-features = false }
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.10.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "time", "uuid", "migrate", "macros"] }
tempfile = "3.27.0"
testcontainers = "0.28.0"
thiserror = "2.0.21"
# agentgateway v1.7.0's tokenizer, for counting answers (plan 1c).
tiktoken = { version = "4.1.2", default-features = false, features = ["vocab-o200k_base"] }
time = "0.3.55"
tokio = "1.54.1"
tokio-stream = "0.1.19"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.29.0"

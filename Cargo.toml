[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/arindamchoudhury/sekisho"

[workspace.dependencies]
sekisho-core = { path = "crates/sekisho-core" }
sekisho-store = { path = "crates/sekisho-store" }
aes-gcm = "0.11.1"
base64 = "0.23.1"
jsonschema = { version = "0.60.1", default-features = false }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "time", "uuid", "migrate", "macros"] }
testcontainers = "0.28.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = "1.54.1"
tokio-stream = "0.1.19"
tracing = "0.1.44"
uuid = "1.29.0"
